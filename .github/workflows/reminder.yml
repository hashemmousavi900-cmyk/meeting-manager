name: Daily Task Reminder

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          cat << 'EOF' > check-tasks.js
          async function run() {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              const tomorrowStr = tomorrow.toISOString().slice(0, 10);

              const url = `${process.env.SUPABASE_URL}/rest/v1/tasks?date=eq.${tomorrowStr}&completed=eq.false`;
              
              const response = await fetch(url, {
                  method: 'GET',
                  headers: {
                      'apikey': process.env.SUPABASE_KEY,
                      'Authorization': `Bearer ${process.env.SUPABASE_KEY}`
                  }
              });

              const tasks = await response.json();

              if (!tasks || tasks.length === 0) {
                  console.log("No tasks for tomorrow.");
                  return;
              }

              let htmlBody = "<h3>🔔 یادآوری تسک‌ها و ریمایندرهای فردا</h3><ul>";
              tasks.forEach(task => {
                  const icon = task.type === "task" ? "✅" : "⏰";
                  htmlBody += `<li><b>${icon} ${task.title}</b> (ساعت: ${task.time})`;
                  if (task.description && task.description !== "No description") {
                      htmlBody += ` - ${task.description}`;
                  }
                  htmlBody += `</li>`;
              });
              htmlBody += "</ul><br>سیستم مدیریت جلسات";

              // ارسال ایمیل با API سرویس Brevo
              const brevoResponse = await fetch('https://api.brevo.com/v3/smtp/email', {
                  method: 'POST',
                  headers: {
                      'api-key': process.env.BREVO_API_KEY,
                      'Content-Type': 'application/json',
                      'accept': 'application/json'
                  },
                  body: JSON.stringify({
                      sender: { 
                          email: process.env.EMAIL_USER, 
                          name: "Meeting Manager" 
                      },
                      to: [{ email: process.env.RECIPIENT_EMAIL }],
                      subject: "یادآوری تسک برای فردا",
                      htmlContent: htmlBody
                  })
              });

              if (brevoResponse.ok) {
                  console.log("Email sent successfully via Brevo to: " + process.env.RECIPIENT_EMAIL);
              } else {
                  const errorData = await brevoResponse.text();
                  throw new Error("Failed to send email: " + errorData);
              }
          }

          run().catch(e => { console.error(e); process.exit(1); });
          EOF
          node check-tasks.js
