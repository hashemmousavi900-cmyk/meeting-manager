name: Daily Task Reminder (Bale Messenger)

on:
  schedule:
    - cron: '0 4 * * *'      # 4 صبح هر روز (به وقت UTC)
    - cron: '*/30 * * * *'   # هر 30 دقیقه
  workflow_dispatch:

jobs:
  send-bale-message:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # نسخه پایدار LTS

      - name: Run Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          cat << 'EOF' > check-tasks.js
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_KEY;
          const BALE_TOKEN = process.env.BALE_TOKEN;
          const BALE_CHAT_ID = process.env.BALE_CHAT_ID;
          
          const headers = {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json'
          };
          
          async function sendBaleMessage(message) {
              const baleUrl = `https://tapi.bale.ai/bot${BALE_TOKEN}/sendMessage`;
              const response = await fetch(baleUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      chat_id: BALE_CHAT_ID,
                      text: message,
                      parse_mode: "Markdown"
                  })
              });
              if (!response.ok) {
                  const error = await response.text();
                  throw new Error("Bale API error: " + error);
              }
              return true;
          }
          
          async function saveSentNotification(taskId, type) {
              try {
                  const url = `${SUPABASE_URL}/rest/v1/notifications`;
                  const data = {
                      task_id: taskId,
                      type: type,
                      sent_at: new Date().toISOString()
                  };
                  await fetch(url, {
                      method: 'POST',
                      headers: headers,
                      body: JSON.stringify(data)
                  });
              } catch(e) {
                  console.error('Error saving notification:', e);
              }
          }
          
          async function checkIfAlreadySent(taskId, type) {
              try {
                  const url = `${SUPABASE_URL}/rest/v1/notifications?task_id=eq.${taskId}&type=eq.${type}&select=id`;
                  const response = await fetch(url, {
                      method: 'GET',
                      headers: headers
                  });
                  const data = await response.json();
                  return data && data.length > 0;
              } catch(e) {
                  console.error('Error checking notification:', e);
                  return false;
              }
          }
          
          async function run() {
              // ⭐️ رفع مشکل زمان‌بندی: تبدیل زمان سرور گیت‌هاب به وقت ایران (UTC+3:30)
              const now = new Date();
              const tehranOffset = 3.5 * 60 * 60 * 1000; // 3.5 ساعت به میلی‌ثانیه
              const tehranTime = new Date(now.getTime() + tehranOffset);
              
              const todayStr = tehranTime.toISOString().slice(0, 10);
              const currentHour = tehranTime.getUTCHours();
              const currentMinute = tehranTime.getUTCMinutes();
              const currentTimeInMinutes = currentHour * 60 + currentMinute;
              
              console.log(`🕐 Running at Iran Time: ${tehranTime.toISOString()}`);
              console.log(`📅 Today: ${todayStr}`);
              
              // 1️⃣ یادآوری روز قبل (فقط در ساعت 7:30 صبح به وقت ایران که 4:00 UTC است)
              if (currentHour === 4 && currentMinute < 30) {
                  console.log("📤 Checking tomorrow reminder...");
                  
                  const tomorrow = new Date(tehranTime.getTime() + (24 * 60 * 60 * 1000));
                  const tomorrowStr = tomorrow.toISOString().slice(0, 10);
                  
                  const url = `${SUPABASE_URL}/rest/v1/tasks?date=eq.${tomorrowStr}&completed=eq.false`;
                  const response = await fetch(url, {
                      method: 'GET',
                      headers: headers
                  });
                  const tasks = await response.json();
                  
                  if (tasks && tasks.length > 0) {
                      let tasksToNotify = [];
                      for (const task of tasks) {
                          // بررسی اینکه برای این تسک خاص، یادآوری daily ارسال نشده باشد
                          const alreadySent = await checkIfAlreadySent(task.id, 'daily');
                          if (!alreadySent) {
                              tasksToNotify.push(task);
                          }
                      }

                      if (tasksToNotify.length > 0) {
                          let message = "🔔 *یادآوری تسک‌ها و ریمایندرهای فردا*\n\n";
                          tasksToNotify.forEach(task => {
                              const icon = task.type === "task" ? "✅" : "⏰";
                              message += `${icon} *${task.title}* (ساعت: ${task.time})\n`;
                              if (task.description && task.description !== "No description") {
                                  message += `   📝 ${task.description}\n`;
                              }
                          });
                          message += "\n📌 سیستم مدیریت جلسات";
                          
                          await sendBaleMessage(message);
                          console.log("✅ Tomorrow reminder sent!");
                          
                          // ذخیره برای هر تسک به صورت جداگانه
                          for (const task of tasksToNotify) {
                              await saveSentNotification(task.id, 'daily');
                          }
                      } else {
                          console.log("⏭️ Tomorrow reminder already sent today.");
                      }
                  } else {
                      console.log("📭 No tasks for tomorrow.");
                  }
              }
              
              // 2️⃣ یادآوری 2 ساعت قبل
              console.log("⏰ Checking for 2-hour reminders...");
              
              const url = `${SUPABASE_URL}/rest/v1/tasks?date=eq.${todayStr}&completed=eq.false`;
              const response = await fetch(url, {
                  method: 'GET',
                  headers: headers
              });
              const tasks = await response.json();
              
              if (!tasks || tasks.length === 0) {
                  console.log("📭 No tasks for today.");
                  return;
              }
              
              const tasksToNotify = [];
              for (const task of tasks) {
                  if (!task.time) continue;
                  
                  const [hour, minute] = task.time.split(':').map(Number);
                  const taskTimeInMinutes = hour * 60 + minute;
                  const diffInMinutes = taskTimeInMinutes - currentTimeInMinutes;
                  
                  // ⭐️ پنجره را به 30 دقیقه (115 تا 145) گسترش دادیم تا با کرون 30 دقیقه‌ای هماهنگ شود
                  if (diffInMinutes >= 115 && diffInMinutes <= 145) {
                      const alreadySent = await checkIfAlreadySent(task.id, 'two_hour');
                      if (!alreadySent) {
                          tasksToNotify.push(task);
                      }
                  }
              }
              
              if (tasksToNotify.length > 0) {
                  let message = "⏰ *یادآوری ۲ ساعت قبل از تسک‌ها*\n\n";
                  tasksToNotify.forEach(task => {
                      const icon = task.type === "task" ? "✅" : "⏰";
                      message += `${icon} *${task.title}*\n`;
                      message += `   🕐 زمان: ${task.time}\n`;
                      if (task.description && task.description !== "No description") {
                          message += `   📝 ${task.description}\n`;
                      }
                      message += `   ⏳ ۲ ساعت تا شروع\n\n`;
                  });
                  message += "📌 سیستم مدیریت جلسات";
                  
                  await sendBaleMessage(message);
                  
                  for (const task of tasksToNotify) {
                      await saveSentNotification(task.id, 'two_hour');
                  }
                  
                  console.log(`✅ 2-hour reminder sent for ${tasksToNotify.length} tasks!`);
              } else {
                  console.log("📭 No tasks need 2-hour reminder now.");
              }
              
              console.log("✅ Job completed successfully!");
          }
          
          run().catch(e => { 
              console.error('❌ Error:', e); 
              process.exit(1); 
          });
          EOF
          node check-tasks.js
