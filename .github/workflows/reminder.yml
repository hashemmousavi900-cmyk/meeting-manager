name: Daily Task Reminder (Bale Messenger)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  send-bale-message:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          cat << 'EOF' > check-tasks.js
          async function run() {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              const tomorrowStr = tomorrow.toISOString().slice(0, 10);

              const url = `${process.env.SUPABASE_URL}/rest/v1/tasks?date=eq.${tomorrowStr}&completed=eq.false`;
              
              const response = await fetch(url, {
                  method: 'GET',
                  headers: {
                      'apikey': process.env.SUPABASE_KEY,
                      'Authorization': `Bearer ${process.env.SUPABASE_KEY}`
                  }
              });

              const tasks = await response.json();

              if (!tasks || tasks.length === 0) {
                  console.log("No tasks for tomorrow.");
                  return;
              }

              let message = "🔔 *یادآوری تسک‌ها و ریمایندرهای فردا*\n\n";
              tasks.forEach(task => {
                  const icon = task.type === "task" ? "✅" : "⏰";
                  message += `${icon} *${task.title}* (ساعت: ${task.time})\n`;
                  if (task.description && task.description !== "No description") {
                      message += `   📝 ${task.description}\n`;
                  }
              });
              message += "\nسیستم مدیریت جلسات";

              // ارسال پیام با API بله
              const baleUrl = `https://tapi.bale.ai/bot${process.env.BALE_TOKEN}/sendMessage`;
              
              const baleResponse = await fetch(baleUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      chat_id: process.env.BALE_CHAT_ID,
                      text: message,
                      parse_mode: "Markdown"
                  })
              });

              if (baleResponse.ok) {
                  console.log("Bale message sent successfully!");
              } else {
                  const errorData = await baleResponse.text();
                  throw new Error("Failed to send Bale message: " + errorData);
              }
          }

          run().catch(e => { console.error(e); process.exit(1); });
          EOF
          node check-tasks.js
