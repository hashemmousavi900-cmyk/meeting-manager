name: Daily Task Reminder (Chmail Test)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nodemailer
        run: npm install nodemailer

      - name: Run Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          cat << 'EOF' > check-tasks.js
          const nodemailer = require("nodemailer");

          async function run() {
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              const tomorrowStr = tomorrow.toISOString().slice(0, 10);

              const url = `${process.env.SUPABASE_URL}/rest/v1/tasks?date=eq.${tomorrowStr}&completed=eq.false`;
              
              const response = await fetch(url, {
                  method: 'GET',
                  headers: {
                      'apikey': process.env.SUPABASE_KEY,
                      'Authorization': `Bearer ${process.env.SUPABASE_KEY}`
                  }
              });

              const tasks = await response.json();

              if (!tasks || tasks.length === 0) {
                  console.log("No tasks for tomorrow.");
                  return;
              }

              let htmlBody = "<h3>🔔 یادآوری تسک‌ها و ریمایندرهای فردا</h3><ul>";
              tasks.forEach(task => {
                  const icon = task.type === "task" ? "✅" : "⏰";
                  htmlBody += `<li><b>${icon} ${task.title}</b> (ساعت: ${task.time})`;
                  if (task.description && task.description !== "No description") {
                      htmlBody += ` - ${task.description}`;
                  }
                  htmlBody += `</li>`;
              });
              htmlBody += "</ul><br>سیستم مدیریت جلسات";

              // تنظیمات SMTP برای چاپار میل
              let transporter = nodemailer.createTransport({
                  host: 'smtp.chmail.ir', 
                  port: 587,              
                  secure: false,          
                  auth: { 
                      user: process.env.EMAIL_USER, 
                      pass: process.env.EMAIL_PASS 
                  }
              });

              // ارسال ایمیل به خود ایمیل چاپار میل برای تست
              await transporter.sendMail({
                  from: `"Meeting Manager" <${process.env.EMAIL_USER}>`,
                  to: process.env.EMAIL_USER, // ایمیل گیرنده همان ایمیل فرستنده (چاپار میل) است
                  subject: "تست یادآوری تسک برای فردا",
                  html: htmlBody
              });

              console.log("Email sent successfully to Chmail: " + process.env.EMAIL_USER);
          }

          run().catch(e => { console.error(e); process.exit(1); });
          EOF
          node check-tasks.js
